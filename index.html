<style>:root{--red:#DA291C;--ink:#1f2328;--ink2:#57606a;--ink3:#8a929b;--bg:#f3f4f6;--card:#fff;--line:#e3e6ea;--soft:#f7f8fa;

table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#f7f8fa;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}

.btn:hover{background:var(--soft)}.btn.pri{background:var(--red);border-color:var(--red);color:#fff}

.wk{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.wk .h{padding:10px 14px;background:#f7f8fa;border-bottom:1px solid var(--line)}

.issues .iss{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;overflow:hidden}.iss .ih{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer}

.job{white-space:nowrap}td.num{white-space:nowrap}
/* ---- v2: milestones, stage list, Gantt ---- */
.ms{display:flex;padding:8px 2px 2px}.ms .st{flex:1;min-width:96px;text-align:center;position:relative;padding-top:24px}
.ms .st:before{content:'';position:absolute;top:9px;left:-50%;width:100%;height:3px;background:#d3d8de}.ms .st:first-child:before{display:none}
.ms .st.done:before,.ms .st.cur:before{background:var(--ok)}
.ms .st i{position:absolute;top:2px;left:50%;margin-left:-8px;width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid #c4cad2;z-index:1}
.ms .st.done i{background:var(--ok);border-color:var(--ok)}.ms .st.cur i{background:#f5a524;border-color:#f5a524;box-shadow:0 0 0 4px var(--minorbg)}.ms .st.late i{border-color:var(--major)}

<script>/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=s=>{if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((a-b)/864e5); // a-b in days
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fs=d=>d?MON[d.getMonth()]+' '+d.getDate():'—';
const fl=d=>d?DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():'—';
const fsy=d=>d?MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():'—';
const fmt=n=>n==null?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:1});
const COL={aligned:'#1e8e5a',minor:'#c98a00',major:'#d92d20',miss:'#5b6472',info:'#2f6feb',ship:'#0b7a6d'};
const RECS=DATA.recs; RECS.forEach(r=>{if(r.thr)Object.keys(r.thr).forEach(k=>{if(/^\d{4}-/.test(r.thr[k]||'')&&+r.thr[k].slice(0,4)<2020)r.thr[k]=null});r.pLd=P(r.pL);r.pRd=P(r.pR);r.pTd=P(r.pT);r.swD=P(r.sw_ship);r.jlD=P(r.jl_sched);r.jaD=P(r.jl_actual);r.jmD=P(r.jl_master)});
let TODAY=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const WINDOW=28;
let OVERRIDE=null;

/* ===== core model ===== */
const STATUS={aligned:['Aligned','b-aligned'],minor:['1–7 days apart','b-minor'],major:['Over 7 days apart','b-major'],missing_jl:['No Job List date','b-miss'],missing_prod:['No Production date','b-miss'],nodate:['No date in either','b-miss'],jl_only:['Not in production plan','b-info'],shipped:['Shipped','b-ship'],cancelled:['Cancelled','b-miss'],ready:['Ready to ship','b-ship'],none:['No dates','b-miss']};
function model(){
  const t=TODAY, end=addD(t,WINDOW-1);
  RECS.forEach(r=>{
    r.prodEff=r.swD||r.pTd||r.pRd||r.pLd; r.prodSrc=r.swD?'RAIL schedule (final ship date)':r.pTd?'PM-reviewed projection':r.pRd?'Current projection':r.pLd?'Current projection':null;
    r.shipped=!!r.jaD; r.cancelled=/cancel/i.test(r.jl_txt||''); r.ready=/ready/i.test(r.jl_txt||'');
    r.eff=r.prodEff||r.jlD; r.effSrc=r.prodEff?'Production':r.jlD?'Job List':null;
    r.delta=(r.prodEff&&r.jlD)?diff(r.prodEff,r.jlD):null; // + = production later than Job List
    let s;
    if(r.shipped)s='shipped';else if(r.cancelled)s='cancelled';
    else if(r.in_prod&&r.prodEff&&r.jlD){const a=Math.abs(r.delta);s=a===0?'aligned':a<=7?'minor':'major'}
    else if(r.in_prod&&r.prodEff)s='missing_jl';
    else if(r.in_prod&&r.jlD)s='missing_prod';
    else if(r.in_prod)s=r.ready?'ready':'nodate';
    else if(r.jlD)s='jl_only'; else s=r.ready?'ready':'none';
    r.status=s;
    if(r.ready&&!r.eff)r.status='ready';
    r.active=!r.shipped&&!r.cancelled;
    const e=r.eff;
    r.inWin=!!(r.active&&e&&e>=t&&e<=end);
    r.altWin=!!(r.active&&!r.inWin&&((r.prodEff&&r.prodEff>=t&&r.prodEff<=end)||(r.jlD&&r.jlD>=t&&r.jlD<=end)));
    r.overdue=!!(r.active&&e&&e<t&&(r.in_prod));
    r.daysTo=e?diff(e,t):null;
    const left=(r.assy_left||0)+(r.test_left||0), known=r.assy_left!=null||r.test_left!=null;
    r.hrsLeft=known?left:null;
    r.flags=[];
    if(r.in_prod){
      if(known&&left===0)r.flags.push(['Build complete','']);
      else if(known&&r.daysTo!=null&&r.daysTo<=7&&r.daysTo>=0)r.flags.push([fmt(left)+' h still to build','r']);
      else if(known)r.flags.push([fmt(left)+' h to build','a']);
      else if(r.inWin)r.flags.push(['No hours data','a']);
      if(/ncr/i.test(r.note||''))r.flags.push(['NCR','r']);
      if(/drawing/i.test(r.note||''))r.flags.push(['No drawings','r']);
      if(r.traveler&&!/complete/i.test(r.traveler))r.flags.push(['Traveler: '+r.traveler,'a']);
      if(!r.traveler&&r.inWin)r.flags.push(['No traveler status','a']);
    }
    if(r.status==='major'&&r.inWin)r.flags.push(['Date conflict','r']);
    if(r.status==='minor'&&r.inWin)r.flags.push(['Date differs','a']);
    r.risk=r.flags.some(f=>f[1]==='r')?'high':r.flags.some(f=>f[1]==='a')?'med':'low';
    r.pmDisp=r.pm||'Unassigned';
    r.stage=r.shipped?'Shipped':stageOf(r);
  });
}
const WIN=()=>RECS.filter(r=>r.inWin).sort((a,b)=>a.eff-b.eff||a.job.localeCompare(b.job));
const badge=(s)=>`<span class="badge ${STATUS[s][1]}">${STATUS[s][0]}</span>`;

const ta=h=>`data-tip="${T(h)}"`,la=(title,sub,jobs,link)=>`data-list="${L(title,sub,jobs,link)}"`;

const hint=n=>n?`<div class="hint">Click to see ${n===1?'this job':'the '+n+' jobs'}</div>`:'';
const STDEF={aligned:'Production and the Job List show the same ship date.',minor:'The two files differ by 1 to 7 days.',major:'The two files differ by more than 7 days.',missing_jl:'Production has a date but the Job List scheduled date is empty.',missing_prod:'The Job List has a date but Production has none.',nodate:'No ship date in either file.',jl_only:'The job is in the Job List but not in the production plan.',shipped:'The Job List has an actual ship date.',cancelled:'Marked Cancelled in the Job List.',ready:'Marked READY TO SHIP, so there is no date to compare.',none:'No dates in either file.'};
const STDESC={'Not started':'Before the IFC release date on the Throughput sheet.','Engineering':'IFC released; traveler not yet released.','Released to fab':'Traveler released; fabrication not yet started.','Fab + weld':'Fabrication and welding under way.','Paint':'Paint stage under way.','Assembly':'Assembly under way.','Testing':'Testing and heat run under way.','Built, awaiting ship':'The build-complete date has passed and the job has not shipped yet.','No stage dates':'No row for this job in the Throughput sheet.'};
function flagInfo(t){t=(t||'').trim();
  if(/still to build/.test(t))return `<b>${esc(t)}</b><div>Assembly and testing hours are still outstanding and the job ships within 7 days.</div>`;
  if(/h to build/.test(t))return `<b>${esc(t)}</b><div>Assembly and testing hours still outstanding, with more than 7 days to the ship date.</div>`;
  if(/Build complete/.test(t))return `<b>Build complete</b><div>No assembly or testing hours left in the Production file.</div>`;
  if(t==='NCR')return `<b>NCR</b><div>The Production summary note mentions a non-conformance report on this job.</div>`;
  if(/drawings/.test(t))return `<b>No drawings</b><div>The Production summary note says drawings are missing.</div>`;
  if(/^Traveler/.test(t))return `<b>${esc(t)}</b><div>The traveler status in the Production file is not Completed.</div>`;
  if(/No traveler/.test(t))return `<b>No traveler status</b><div>The Production file has no traveler status for this job.</div>`;
  if(/No hours/.test(t))return `<b>No hours data</b><div>The Production file has no assembly or testing hours for this job.</div>`;
  if(/Date conflict/.test(t))return `<b>Date conflict</b><div>Production and the Job List ship dates are more than 7 days apart.</div>`;
  if(/Date differs/.test(t))return `<b>Date differs</b><div>Production and the Job List ship dates are 1 to 7 days apart.</div>`;
  if(/^JL /.test(t))return `<b>${esc(t)}</b><div>The scheduled ship date in the Job List, which differs from the Production date.</div>`;
  return null}
function jobTip(r){

  return `<b>${esc(r.job)}${r.qty>1?' × '+fmt(r.qty):''}</b><div class="tm">${esc(r.customer||'—')} · ${esc(r.pmDisp)}</div>${r.desc?`<div class="tm">${esc(r.desc)}</div>`:''}<div class="tr"><span>Best ship date</span><b>${r.eff?fsy(r.eff)+' ('+r.effSrc+')':'—'}</b></div><div class="tr"><span>Production</span><b>${r.prodEff?fs(r.prodEff):'—'}</b></div><div class="tr"><span>Job List</span><b>${r.jlD?fs(r.jlD):(r.jl_txt?esc(r.jl_txt):'—')}</b></div>${g?`<div class="tr"><span>Gap</span><b>${g}</b></div>`:''}<div class="tr"><span>Stage</span><b>${esc(r.stage)}</b></div>${r.hrsLeft!=null?`<div class="tr"><span>Build hours left</span><b>${fmt(r.hrsLeft)} h</b></div>`:''}${r.flags.length?`<div class="tr"><span>Flags</span><b>${r.flags.map(f=>esc(f[0])).join(', ')}</b></div>`:''}<div class="hint">Click for full job detail</div>`}
function autoTip(t){
  const el=t.closest&&t.closest('[data-tip],[data-job],.flag,.badge');if(!el)return null;
  if(el.dataset.tip!=null)return TIPS[+el.dataset.tip];
  if(el.dataset.job){const r=RECS.find(x=>x.id===el.dataset.job||x.job===el.dataset.job);return r?jobTip(r):null}
  if(el.classList.contains('flag'))return flagInfo(el.textContent);
  const k=Object.keys(STATUS).find(k=>STATUS[k][0]===el.textContent.trim());return k?`<b>${esc(STATUS[k][0])}</b><div>${STDEF[k]||''}</div>`:null}
function showTip(e){
  const h=autoTip(e.target);if(!h){tip.style.display='none';return}
  tip.innerHTML=h;tip.style.display='block';const w=tip.offsetWidth,ht=tip.offsetHeight;
  let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+ht>innerHeight-8)y=Math.max(8,e.clientY-ht-14);
  tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px'}
document.addEventListener('mousemove',showTip);document.addEventListener('mouseout',e=>{if(!e.relatedTarget)tip.style.display='none'});document.addEventListener('scroll',()=>tip.style.display='none',true);

/* ===== charts (inline SVG) ===== */
function donut(parts,size=180,center){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1;let a0=-Math.PI/2;const R=size/2,r=R*.62;
  let svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  parts.filter(p=>p.v>0).forEach(p=>{
    const a1=a0+p.v/tot*2*Math.PI, big=a1-a0>Math.PI?1:0; const f=a=>[R+R*Math.cos(a),R+R*Math.sin(a)], g=a=>[R+r*Math.cos(a),R+r*Math.sin(a)];
    const full=p.v===tot; let d;
    if(full){d=`M${R},0 A${R},${R} 0 1 1 ${R-.01},0 L${R-.01},${R-r} A${r},${r} 0 1 0 ${R},${R-r}Z`}
    else{const[x0,y0]=f(a0),[x1,y1]=f(a1),[x2,y2]=g(a1),[x3,y3]=g(a0);d=`M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3}Z`}
    svg+=`<path d="${d}" fill="${p.c}" ${p.tip!=null?`data-tip="${p.tip}"`:''} ${p.lst!=null?`data-list="${p.lst}"`:''} style="cursor:pointer">${p.tip==null?`<title>${esc(p.l)}: ${p.v}</title>`:''}</path>`;a0=a1});
  if(center)svg+=`<text x="${R}" y="${R-2}" pointer-events="none" text-anchor="middle" font-size="26" font-weight="750" fill="#1f2328">${center[0]}</text><text x="${R}" y="${R+16}" pointer-events="none" text-anchor="middle" font-size="11" fill="#57606a">${center[1]}</text>`;
  return svg+'</svg>';
}
function bars(items,{w=520,h=220,unit='',cap=null,capLabel='',colors}={}){
  const m={l:38,r:10,t:16,b:44},iw=w-m.l-m.r,ih=h-m.t-m.b;const mx=Math.max(1,...items.map(i=>i.stack?i.stack.reduce((a,s)=>a+s.v,0):i.v),cap||0)*1.12;
  const bw=Math.min(54,iw/items.length*.62);let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">`;
  const ticks=4;for(let i=0;i<=ticks;i++){const y=m.t+ih-ih*i/ticks,v=mx*i/ticks;s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="#e8ebef"/><text x="${m.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#8a929b">${Math.round(v)}</text>`}
  items.forEach((it,i)=>{const cx=m.l+iw*(i+.5)/items.length;let y0=m.t+ih;
    const segs=it.stack||[{v:it.v,c:it.c||'#da291c'}];
    segs.forEach(sg=>{const hh=sg.v/mx*ih;if(hh>0){s+=`<rect data-i="${i}" x="${cx-bw/2}" y="${y0-hh}" width="${bw}" height="${hh}" rx="3" fill="${sg.c}" ${sg.tip!=null?`data-tip="${sg.tip}"`:''} ${sg.lst!=null?`data-list="${sg.lst}"`:''} style="cursor:pointer">${sg.tip==null?`<title>${esc(it.t||it.l)}: ${fmt(sg.v)}${unit}</title>`:''}</rect>`;y0-=hh}});
    const tot=segs.reduce((a,x)=>a+x.v,0);s+=`<text x="${cx}" y="${y0-5}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328">${tot?fmt(tot):''}</text>`;
    (it.l+'').split('\n').forEach((ln,k)=>s+=`<text x="${cx}" y="${h-m.b+16+k*13}" text-anchor="middle" font-size="10.5" fill="#57606a">${esc(ln)}</text>`)});
  if(cap){const y=m.t+ih-cap/mx*ih;s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}" stroke="#d92d20" stroke-width="1.6" stroke-dasharray="5 4"/><text x="${w-m.r}" y="${y-5}" text-anchor="end" font-size="10.5" font-weight="700" fill="#d92d20">${capLabel||'Capacity '+cap}</text>`}
  return s+'</svg>';
}

const STG=[['ifc','trav','Engineering (IFC to traveler)','#9aa3ad'],['trav','fab','Release to fab','#c9ced4'],['fab','paint','Fab + weld','#2f6feb'],['paint','assy','Paint','#8b5cf6'],['assy','test','Assembly','#da291c'],['test','proj','Testing and heat run','#0b7a6d']];

function msStrip(r,vert){
  const t=r.thr;
  if(!t||!MSD.some(m=>t[m[0]]))return '<div class="note">This job has no stage dates in the Throughput sheet, so no milestones can be shown.</div>';
  const st=MSD.filter(m=>t[m[0]]).map(m=>({l:m[1],d:P(t[m[0]])}));
  st.push({l:'Ship',d:r.eff,ship:true});
  let cur=-1;st.forEach((s,i)=>{if(!s.ship&&s.d<=TODAY)cur=i});
  const html=st.map((s,i)=>{
    const done=s.ship?r.shipped:(i<cur||(i===cur&&r.shipped)),isCur=!s.ship&&i===cur&&!r.shipped;
    const late=s.ship&&!r.shipped&&r.eff&&r.eff<TODAY;
    const nd=s.d?diff(s.d,TODAY):null;
    return `<div class="st ${done?'done':''} ${isCur?'cur':''} ${late?'late':''}" ${ta(`<b>${esc(s.l)}</b><div class="tm">${MSDESC[s.l]||''}</div><div class="tr"><span>Date</span><b>${s.d?fsy(s.d):'No date'}</b></div><div class="tr"><span>Status</span><b>${done?'Done by plan':isCur?'Current stage':late?'Past due':'Upcoming'}</b></div>${nd!=null?`<div class="tr"><span>From viewing date</span><b>${nd>=0?'in '+nd+' days':Math.abs(nd)+' days ago'}</b></div>`:''}`)}><i></i><div class="tx"><div class="l">${esc(s.l)}${isCur?' <span class="now">now</span>':''}</div><div class="d">${s.d?fs(s.d):'No date'}${late?' · past due':''}</div>${s.ship&&r.jlD&&r.delta?`<div class="d" style="color:${Math.abs(r.delta)>7?COL.major:COL.minor}">Job List ${fs(r.jlD)}</div>`:''}</div></div>`}).join('');

let AF={st:'',pm:'',q:''};
function vAlign(){
  const comp=RECS.filter(r=>r.delta!=null&&r.active);

  const hb=bins.map(([l,f],i)=>{const js=comp.filter(r=>f(r.delta)),c=i===3?COL.aligned:(i===2||i===4)?COL.minor:COL.major,mean=i===3?'Both files show the same date.':i<3?'Production expects the job to ship earlier than the Job List says.':'Production expects the job to ship later than the Job List says.';return {l,v:js.length,c,t:l+' days',stack:[{v:js.length,c,tip:T(`<b>${l} days</b><div class="tm">Production date minus Job List date</div><div>${mean}</div><div class="tr"><span>Jobs</span><b>${js.length}</b></div>${names(js,6)}${hint(js.length)}`),lst:L('Gap: '+l+' days','Production date minus Job List date',js,{go:'align',st:'mis',label:'Open Date Alignment table'})}]}});
  const pa=P(DATA.prod_asof),pt=P(DATA.thr_asof);
  const mk=(k,l,js,c)=>({k,l,v:js.length,c,tip:T(`<b>${l}</b><div>${STDEF[k]}</div><div class="tr"><span>Jobs</span><b>${js.length} of ${comp.length}</b></div>${names(js,6)}${hint(js.length)}`),lst:L(l,STDEF[k],js,{go:'align',st:k,label:'Filter the table below'})});
  const ps=[mk('aligned','Aligned',comp.filter(r=>r.delta===0),COL.aligned),mk('minor','1–7 days apart',comp.filter(r=>r.status==='minor'),COL.minor),mk('major','Over 7 days apart',comp.filter(r=>r.status==='major'),COL.major)];
  let h=`<div class="grid g3"><div class="card"><h3>File freshness<small>how current is each source?</small></h3><div class="body">
   <div class="kv" ${ta('<b>File freshness</b><div>The Delivery dates and Throughput sheets each carry an “as of” date. The Job List workbook has none, so its age cannot be checked.</div><div class="tm">When the production sheets are dated apart, a job can show a different projection on each.</div>')}><div>Production · Delivery dates</div><div><b>${fsy(pa)}</b> <span class="note">stamped in sheet</span></div><div>Production · Throughput</div><div><b>${fsy(pt)}</b> <span class="note">stamped in sheet</span></div><div>Job List</div><div><b>No date stamp</b><div class="note">the workbook has no “as of” date, so its age cannot be checked</div></div></div>
   ${Math.abs(diff(pa,pt))?`<div class="ribbon warn" style="margin:12px 0 0;cursor:default"><span class="ic">⏱</span><div>The two production sheets are <b>${Math.abs(diff(pa,pt))} days apart</b>. ${RECS.filter(r=>r.thr&&r.pLd&&r.thr.proj&&iso(r.pLd)!==r.thr.proj).length} jobs show a different projection on each sheet.</div></div>`:''}</div></div>
  <div class="card"><h3>Alignment summary<small>${comp.length} jobs with a date in both files</small></h3><div class="body" style="text-align:center">${donut(ps,170,[comp.length?Math.round(ps[0].v/comp.length*100)+'%':'–','aligned'])}<div class="legend" style="justify-content:center">${ps.map(p=>`<span class="clk" data-tip="${p.tip}" data-list="${p.lst}"><i style="background:${p.c}"></i>${p.l} ${p.v}</span>`).join('')}</div></div></div>
  <div class="card"><h3>Gap size<small>Production date minus Job List date</small></h3><div class="body">${bars(hb,{h:215,w:420})}<div class="note">Positive = Production expects the job to ship later than the Job List says.</div></div></div></div>`;
  // dumbbell
  const db=comp.filter(r=>r.delta!==0).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,24);
  if(db.length){const all=[];db.forEach(r=>{all.push(r.prodEff,r.jlD)});let a=new Date(Math.min(...all,TODAY)),b=new Date(Math.max(...all,TODAY));a=addD(a,-5);b=addD(b,14);
    const W=1100,L=150,R=70,rh=24,H=db.length*rh+38,tw=W-L-R,span=diff(b,a),X=d=>L+diff(d,a)/span*tw;
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;min-width:760px">`;
    for(let m=new Date(a.getFullYear(),a.getMonth()+1,1);m<=b;m=new Date(m.getFullYear(),m.getMonth()+1,1)){const x=X(m);s+=`<line x1="${x}" x2="${x}" y1="20" y2="${H}" stroke="#e8ebef"/><text x="${x+4}" y="14" font-size="11" font-weight="700" fill="#57606a">${MON[m.getMonth()]} ${m.getFullYear()}</text>`}
    db.forEach((r,i)=>{const y=34+i*rh,x1=X(r.jlD),x2=X(r.prodEff),c=Math.abs(r.delta)>7?COL.major:COL.minor;
      s+=`<g style="cursor:pointer" onclick="openJob('${esc(r.id)}')" ${ta(`<b>${esc(r.job)}</b><div class="tm">${esc(r.customer||'')} · ${esc(r.pmDisp)}</div><div class="tr"><span>Job List date</span><b>${fsy(r.jlD)}</b></div><div class="tr"><span>Production date</span><b>${fsy(r.prodEff)}</b></div><div class="tr"><span>Gap</span><b>${Math.abs(r.delta)} days (${r.delta>0?'Production later':'Job List later'})</b></div><div class="tm">${esc(action(r))}</div><div class="hint">Click for full job detail</div>`)}><rect x="0" y="${y-11}" width="${W}" height="${rh-1}" fill="transparent"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11.5" font-weight="700">${esc(r.job)}</text><line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="3" opacity=".55"/><circle cx="${x1}" cy="${y}" r="6" fill="#fff" stroke="${COL.info}" stroke-width="2.5"/><circle cx="${x2}" cy="${y}" r="6" fill="#1f2328"/><text x="${Math.max(x1,x2)+12}" y="${y+4}" font-size="11" font-weight="700" fill="${c}">${deltaTxt(r)}</text></g>`});
    const tx=X(TODAY);s+=`<line x1="${tx}" x2="${tx}" y1="20" y2="${H}" stroke="#da291c" stroke-width="2"/><text x="${tx+4}" y="${H-4}" font-size="11" font-weight="800" fill="#da291c">Today</text></svg>`;

  h+=`<div class="card"><h3>Job-by-job comparison<small id="acount"></small><button class="btn" style="margin-left:10px" onclick="csvAlign()">Download CSV</button></h3><div class="body"><div class="toolbar"><select id="afs"><option value="">All statuses</option><option value="mis">Not aligned (any)</option><option value="major">Over 7 days apart</option><option value="minor">1–7 days apart</option><option value="aligned">Aligned</option><option value="missing_jl">No Job List date</option><option value="missing_prod">No Production date</option><option value="jl_only">Only in Job List</option></select><select id="apm"><option value="">All PMs</option>${pmList().map(p=>`<option>${esc(p)}</option>`).join('')}</select><input id="aq" placeholder="Search job or customer"></div><div class="tbwrap" id="atb"></div></div></div>`;
  return h;
}
function alignRows(){
  const q=AF.q.toLowerCase();
  return RECS.filter(r=>r.active&&(r.in_prod||r.jlD)).filter(r=>{
    if(AF.st==='mis'&&!(r.status==='minor'||r.status==='major'))return false;
    if(AF.st&&AF.st!=='mis'&&r.status!==AF.st)return false;
    if(AF.pm&&r.pm!==AF.pm)return false;
    if(q&&!(r.job+' '+(r.customer||'')+' '+(r.desc||'')).toLowerCase().includes(q))return false;return true})
   .sort((a,b)=>(b.delta!=null?Math.abs(b.delta):-1)-(a.delta!=null?Math.abs(a.delta):-1));
}
function drawAlign(){
  const rows=alignRows();$('#acount').textContent=rows.length+' jobs';
  $('#atb').innerHTML=`<table><thead><tr><th class="nosort">Job</th><th class="nosort">Customer</th><th class="nosort">PM</th><th class="nosort">Production date</th><th class="nosort">Job List date</th><th class="nosort num">Gap</th><th class="nosort">Status</th><th class="nosort">Suggested action</th></tr></thead><tbody>${rows.map(r=>`<tr class="row" data-job="${esc(r.id)}"><td class="job">${esc(r.job)}</td><td>${esc(r.customer||'—')}</td><td>${esc(r.pmDisp)}</td><td>${r.prodEff?fs(r.prodEff)+`<div class="note">${r.prodSrc}</div>`:'<span class="muted">—</span>'}</td><td>${r.jlD?fsy(r.jlD):(r.jl_txt?esc(r.jl_txt):'<span class="muted">—</span>')}</td><td class="num" style="font-weight:700;color:${r.delta?(Math.abs(r.delta)>7?COL.major:COL.minor):COL.aligned}">${deltaTxt(r)}</td><td>${badge(r.status)}</td><td class="note">${action(r)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No jobs match</td></tr>'}</tbody></table>`;
}
function action(r){
  if(r.status==='aligned')return 'None';
  if(r.status==='minor'||r.status==='major')return r.delta>0?`Production is later: PM to confirm and move the Job List date, or ask Production to pull in`:`Job List is later: Production to confirm the earlier date or the PM to update the Job List`;
  if(r.status==='missing_jl')return 'PM to add a scheduled ship date to the Job List';
  if(r.status==='missing_prod')return 'Production to add the job to the delivery plan';
  if(r.status==='jl_only')return 'Not yet in the production plan';
  if(r.status==='nodate')return 'No date in either file';
  return '';
}

  const inp=$('#vd');inp.value=iso(TODAY);
  inp.onchange=()=>{if(inp.value){TODAY=P(inp.value);OVERRIDE=true;render()}};
  $('#vdr').onclick=()=>{const n=new Date();TODAY=new Date(n.getFullYear(),n.getMonth(),n.getDate());inp.value=iso(TODAY);render()};
  $('#scrim').onclick=closeJob;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeJob()});
  document.body.addEventListener('click',e=>{if(e.target.closest('[data-job],.row,.gr,a,button,select,input,label'))return;const el=e.target.closest('[data-list]');if(el)openList(+el.dataset.list)});
  render();
});
</script></body></html>
